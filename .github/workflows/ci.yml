name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 black mypy pytest pytest-cov bandit

      - name: Lint
        run: |
          flake8 feddup/ app.py worker.py
          black --check feddup/ app.py worker.py
          mypy feddup/ --ignore-missing-imports || true

      - name: Test
        run: |
          pytest tests/ -v --cov=feddup --cov-report=xml

      - name: Security check
        run: |
          bandit -r feddup/ -f json -o bandit-report.json || true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: feddup-coverage
