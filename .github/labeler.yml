# Labeler configuration for Fed-Dup
# Automatically labels PRs based on changed files.

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'
          - 'wiki/**'

github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'

docker:
  - changed-files:
      - any-glob-to-any-file:
          - 'Dockerfile'
          - 'docker-compose.yml'
          - '.dockerignore'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'

core:
  - changed-files:
      - any-glob-to-any-file:
          - 'feddup/**'
          - 'app.py'
          - 'worker.py'

config:
  - changed-files:
      - any-glob-to-any-file:
          - 'config.json.example'
          - '.env.example'
          - 'requirements.txt'

ui:
  - changed-files:
      - any-glob-to-any-file:
          - 'styles.css'
          - 'index.html'
          - 'social-image.png'
